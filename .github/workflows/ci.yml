name: QC CLI checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: CLI and runtime tests
        run: npm test
      - name: Evidence gate regression tests
        run: node test/quality-gate.js
      - name: Private reference guard
        run: npm run check:leaks
